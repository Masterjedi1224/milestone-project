name: Terraform

on:
  pull_request:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan for the selected branch
        type: boolean
        default: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

defaults:
  run:
    working-directory: infrastructure

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Validate Terraform roots
        shell: bash
        run: |
          for root in bootstrap .; do
            if compgen -G "$root/*.tf" >/dev/null; then
              terraform -chdir="$root" init -backend=false -lockfile=readonly
              terraform -chdir="$root" validate
            fi
          done

  deploy:
    name: Plan or apply ${{ github.ref_name }}
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/dev' ||
       github.ref == 'refs/heads/staging' ||
       github.ref == 'refs/heads/production')
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    concurrency:
      group: terraform-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ github.ref_name }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      STATE_REGION: ${{ vars.TF_STATE_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false
      - name: Check deployment configuration
        shell: bash
        run: |
          : "${STATE_BUCKET:?Set TF_STATE_BUCKET on the matching GitHub environment}"
          : "${STATE_REGION:?Set TF_STATE_REGION on the matching GitHub environment}"
          : "${AWS_ROLE_ARN:?Set AWS_TERRAFORM_ROLE_ARN on the matching GitHub environment}"
          for file in backend.tf "environments/${DEPLOY_ENV}.tfvars"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=infrastructure/$file::Required deployment file is missing"
              exit 1
            fi
          done
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.STATE_REGION }}
      - name: Initialize S3 state
        run: |
          terraform init -lockfile=readonly \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${STATE_REGION}" \
            -backend-config="key=milestone-badges/${DEPLOY_ENV}/terraform.tfstate"
      - name: Plan
        run: terraform plan -lock-timeout=5m -var-file="environments/${DEPLOY_ENV}.tfvars" -out=deployment.tfplan
      - name: Apply
        if: inputs.apply
        run: terraform apply -lock-timeout=5m deployment.tfplan
